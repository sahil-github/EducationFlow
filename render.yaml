services:
  - type: web
    name: educationflow-frontend
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false   # Set this manually in Render dashboard — do NOT hardcode secrets here
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
